name: CI

# Runs on every push to main and on every pull request
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7      # newest major, checked on GitHub Marketplace (Nov 2026)

      - name: Check the page
        run: |
          test -f index.html
          grep -q '<title>' index.html
          grep -q 'Sp23-Bcs-019' index.html

      - name: Extra checks (my own)
        run: |
          # the page must link its stylesheet
          grep -q 'style.css' index.html
          # the stylesheet must exist and not be empty
          test -s style.css
          # the HTML document must be complete, not cut off
          grep -q '</html>' index.html

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # push only when this run is on main; a pull request builds but never pushes
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-a2:latest
